name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & tests (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # validate : en-têtes de licence et Checkstyle ; verify : compilation et tests
      - name: Build
        run: ./mvnw -B -ntp verify

      # Les jars sources et javadoc doivent se construire pour pouvoir publier sur Maven Central
      - name: Check release artifacts
        run: ./mvnw -B -ntp -P release -pl '!gateway-ui-sample' -Dgpg.skip=true -DskipTests verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
