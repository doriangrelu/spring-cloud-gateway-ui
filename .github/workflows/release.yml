name: Release

# Publication sur Maven Central et création de la release GitHub au push d'un tag vX.Y.Z.
# Procédure complète : RELEASING.md

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # Environnement GitHub qui porte les secrets de publication
    environment: spring-cloud-gateway-ui-action
    steps:
      - name: Check publishing secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=""
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets absents ou vides :$missing (secrets du dépôt ou de l'environnement spring-cloud-gateway-ui-action)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25 with Central credentials and GPG key
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check changelog entry
        run: |
          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md n'a pas de section ## [${{ steps.version.outputs.version }}]"
            exit 1
          fi

      - name: Set release version
        run: >
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.22.0:set
          -DnewVersion=${{ steps.version.outputs.version }}
          -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Build, sign and publish to Maven Central
        run: ./mvnw -B -ntp -P release -pl '!gateway-ui-sample' deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Extract release notes
        run: |
          awk -v header="## [${{ steps.version.outputs.version }}]" '
            index($0, header) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || substr($0, 1, 1) == "[") { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
