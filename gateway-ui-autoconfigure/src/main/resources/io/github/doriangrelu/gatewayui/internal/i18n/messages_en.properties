# Catalog of predicates and filters (ADR 0013): written in our own words, completed progressively.
# Factory keys: catalog.<predicate|filter>.<Name>.summary, .details, .example, .arg.<field>
catalog.title=Predicates and filters catalog
catalog.intro=Predicates choose the route of a request, filters change the request or the response. Here are the ones available in this Gateway, explained with an example.
catalog.index=Catalog contents
catalog.kind.predicate=Predicates
catalog.kind.filter=Filters
catalog.badge.custom=custom
catalog.badge.undocumented=undocumented
catalog.documentation=Spring Cloud Gateway documentation ↗
catalog.custom=Factory specific to this application: it is not documented in the catalog.
catalog.undocumented=Not documented in the catalog yet: see the official documentation.
catalog.category.path-host=Path and host
catalog.category.request=Request
catalog.category.date=Date
catalog.category.client=Client
catalog.category.distribution=Distribution
catalog.category.path=Path
catalog.category.request-headers=Request headers
catalog.category.response-headers=Response headers
catalog.category.parameters=Parameters
catalog.category.resilience=Resilience and quotas
catalog.category.body=Body
catalog.category.routing=Routing and response
catalog.category.other=Others
catalog.category.custom=Custom factories

catalog.predicate.Path.summary=Takes the request if its path matches one of the patterns.
catalog.predicate.Path.details=* stands for one segment, ** for the rest of the path, and {id} captures a segment that filters can reuse (SetPath, AddRequestHeader…).
catalog.predicate.Path.arg.patterns=One or more comma-separated patterns, for example /api/orders/**.
catalog.predicate.Path.arg.matchTrailingSlash=true by default: /a/ also matches the /a pattern. Set false to forbid it.
catalog.predicate.Path.example=- Path=/api/users/{id}, /legacy/users/{id}

catalog.predicate.Host.summary=Takes the request based on its Host header.
catalog.predicate.Host.details=Accepts patterns such as **.example.com, and captures variables: {tenant}.example.com.
catalog.predicate.Host.arg.patterns=One or more comma-separated host patterns.
catalog.predicate.Host.example=- Host=api.example.com, {tenant}.example.com

catalog.predicate.Method.summary=Takes the request if its HTTP method is in the list.
catalog.predicate.Method.arg.methods=Comma-separated methods, for example GET, POST.
catalog.predicate.Method.example=- Method=GET, HEAD

catalog.predicate.Header.summary=Takes the request if a header is present, and optionally if its value matches a regular expression.
catalog.predicate.Header.arg.header=Header name.
catalog.predicate.Header.arg.regexp=Optional: Java regular expression the value must match.
catalog.predicate.Header.example=- Header=X-Request-Id, \\d+

catalog.predicate.Query.summary=Takes the request if a parameter is present, and optionally if its value matches a regular expression.
catalog.predicate.Query.arg.param=Parameter name.
catalog.predicate.Query.arg.regexp=Optional: Java regular expression on the value.
catalog.predicate.Query.arg.predicate=Optional: bean testing the value, instead of the regular expression (Java configuration).
catalog.predicate.Query.example=- Query=version, v[12]

catalog.predicate.Cookie.summary=Takes the request if a cookie is present and its value matches a regular expression.
catalog.predicate.Cookie.arg.name=Cookie name.
catalog.predicate.Cookie.arg.regexp=Java regular expression the value must match.
catalog.predicate.Cookie.example=- Cookie=beta, enabled

catalog.predicate.After.summary=Takes requests received after a date: useful to enable a route at release time.
catalog.predicate.After.arg.datetime=Date and time with zone, in ISO 8601 format (Java ZonedDateTime).
catalog.predicate.After.example=- After=2026-11-01T08:00:00+01:00[Europe/Paris]

catalog.predicate.RemoteAddr.summary=Takes the request based on the client IP address.
catalog.predicate.RemoteAddr.details=Behind a proxy or a load balancer, the address seen is the proxy one: prefer XForwardedRemoteAddr in that case.
catalog.predicate.RemoteAddr.arg.sources=Comma-separated addresses or CIDR ranges, for example 10.0.0.0/8.
catalog.predicate.RemoteAddr.example=- RemoteAddr=10.0.0.0/8, 192.168.1.10

catalog.predicate.Weight.summary=Splits traffic between several routes of the same group, by weight.
catalog.predicate.Weight.details=All routes of the group must use the same group name. Useful for a canary release: 90% to v1, 10% to v2.
catalog.predicate.Weight.arg.weight.group=Group name, the same on every route involved.
catalog.predicate.Weight.arg.weight.weight=Weight of this route in the group.
catalog.predicate.Weight.example=- Weight=orders, 90

catalog.filter.StripPrefix.summary=Removes the first path segments before calling the service.
catalog.filter.StripPrefix.details=StripPrefix=1 on /api/orders/42 sends /orders/42 to the service.
catalog.filter.StripPrefix.arg.parts=Number of segments to remove from the start, 1 by default.
catalog.filter.StripPrefix.example=- StripPrefix=1

catalog.filter.PrefixPath.summary=Adds a prefix in front of the path sent to the service.
catalog.filter.PrefixPath.arg.prefix=Prefix to add, for example /v2.
catalog.filter.PrefixPath.example=- PrefixPath=/v2

catalog.filter.RewritePath.summary=Rewrites the path with a regular expression.
catalog.filter.RewritePath.details=Named groups (?<name>...) can be reused in the replacement. In YAML, write $\\{name}: ${...} would be read as a Spring property.
catalog.filter.RewritePath.arg.regexp=Java regular expression applied to the path, for example /api/(?<rest>.*).
catalog.filter.RewritePath.arg.replacement=Replacement path, for example /$\\{rest}.
catalog.filter.RewritePath.example=- RewritePath=/api/users/(?<rest>.*), /users/$\\{rest}

catalog.filter.SetPath.summary=Replaces the whole path, using the variables captured by the Path predicate.
catalog.filter.SetPath.arg.template=New path, with variables, for example /products/{id}.
catalog.filter.SetPath.example=- SetPath=/products/{id}

catalog.filter.AddRequestHeader.summary=Adds a header to the request sent to the service.
catalog.filter.AddRequestHeader.details=The value can reuse a variable captured by Path or Host: {id}. Do not put a secret in clear text: use a ${...} placeholder.
catalog.filter.AddRequestHeader.arg.name=Header name.
catalog.filter.AddRequestHeader.arg.value=Header value.
catalog.filter.AddRequestHeader.example=- AddRequestHeader=X-Request-Source, gateway

catalog.filter.SetRequestHeader.summary=Replaces a request header (or adds it when missing) before calling the service.
catalog.filter.SetRequestHeader.details=Unlike AddRequestHeader, the value sent by the client is overwritten.
catalog.filter.SetRequestHeader.arg.name=Header name.
catalog.filter.SetRequestHeader.arg.value=New value.
catalog.filter.SetRequestHeader.example=- SetRequestHeader=X-Tenant, acme

catalog.filter.RemoveRequestHeader.summary=Removes a header from the request before sending it to the service.
catalog.filter.RemoveRequestHeader.details=Useful to avoid forwarding an internal header or a cookie.
catalog.filter.RemoveRequestHeader.arg.name=Name of the header to remove.
catalog.filter.RemoveRequestHeader.example=- RemoveRequestHeader=Cookie

catalog.filter.AddResponseHeader.summary=Adds a header to the response returned to the client.
catalog.filter.AddResponseHeader.arg.name=Header name.
catalog.filter.AddResponseHeader.arg.value=Header value.
catalog.filter.AddResponseHeader.arg.override=Optional: true to replace a header already present in the response.
catalog.filter.AddResponseHeader.example=- AddResponseHeader=X-Served-By, gateway

catalog.filter.AddRequestParameter.summary=Adds a parameter to the query string of the request sent to the service.
catalog.filter.AddRequestParameter.arg.name=Parameter name.
catalog.filter.AddRequestParameter.arg.value=Parameter value; can reuse a captured variable: {id}.
catalog.filter.AddRequestParameter.example=- AddRequestParameter=source, gateway

catalog.filter.PreserveHostHeader.summary=Sends the original Host header to the service, instead of the one of the target URI.
catalog.filter.PreserveHostHeader.details=Useful when the service builds absolute links from the host requested by the client.
catalog.filter.PreserveHostHeader.example=- PreserveHostHeader

catalog.filter.RedirectTo.summary=Responds with a redirect, without calling any service.
catalog.filter.RedirectTo.details=For a redirect only, give the route the no://op URI.
catalog.filter.RedirectTo.arg.status=Redirect HTTP status, in the 300 series, for example 301 or 302.
catalog.filter.RedirectTo.arg.url=Destination URL, put in the Location header.
catalog.filter.RedirectTo.arg.includeRequestParams=Optional: true to carry the query string of the request over to the redirect.
catalog.filter.RedirectTo.example=- RedirectTo=302, https://www.example.com

catalog.filter.SetStatus.summary=Sets the HTTP status of the response returned to the client.
catalog.filter.SetStatus.arg.status=HTTP status, as a number (404) or a name (NOT_FOUND).
catalog.filter.SetStatus.example=- SetStatus=404

catalog.filter.Retry.summary=Retries the request to the service when it fails.
catalog.filter.Retry.details=By default: 3 retries, on 5xx and network errors, for the GET method only. Beware of non-idempotent requests such as POST.
catalog.filter.Retry.arg.retries=Number of retries, 3 by default.
catalog.filter.Retry.arg.statuses=HTTP statuses that trigger a retry, for example BAD_GATEWAY.
catalog.filter.Retry.arg.methods=Retryable methods, GET by default.
catalog.filter.Retry.arg.backoff.firstBackoff=Wait before the first retry, for example 50ms. Without backoff, retries are immediate.
catalog.filter.Retry.arg.backoff.maxBackoff=Maximum wait between two retries.
catalog.filter.Retry.arg.backoff.factor=Multiplier applied to the wait on each retry.
catalog.filter.Retry.arg.backoff.basedOnPreviousValue=true to compute the wait from the previous one.
catalog.filter.Retry.arg.jitter.randomFactor=Random share added to the wait, between 0 and 1.
catalog.filter.Retry.arg.timeout=Maximum duration of each attempt, unlimited by default.
catalog.filter.Retry.example=- name: Retry\n  args:\n    retries: 3\n    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

