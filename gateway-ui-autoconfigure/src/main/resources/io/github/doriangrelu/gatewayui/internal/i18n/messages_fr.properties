# Catalogue des prédicats et filtres (ADR 0013) : rédigé avec nos propres mots, enrichi progressivement.
# Clés d'une fabrique : catalog.<predicate|filter>.<Nom>.summary, .details, .example, .arg.<champ>
catalog.title=Catalogue des prédicats et filtres
catalog.intro=Les prédicats choisissent la route d'une requête, les filtres modifient la requête ou la réponse. Voici ceux disponibles dans cette Gateway, expliqués avec un exemple.
catalog.index=Sommaire du catalogue
catalog.kind.predicate=Prédicats
catalog.kind.filter=Filtres
catalog.badge.custom=maison
catalog.badge.undocumented=non documenté
catalog.documentation=Documentation de Spring Cloud Gateway ↗
catalog.custom=Fabrique propre à cette application : elle n'est pas documentée dans le catalogue.
catalog.undocumented=Pas encore documentée dans le catalogue : consultez la documentation officielle.
catalog.category.path-host=Chemin et hôte
catalog.category.request=Requête
catalog.category.date=Date
catalog.category.client=Client
catalog.category.distribution=Répartition
catalog.category.path=Chemin
catalog.category.request-headers=En-têtes de requête
catalog.category.response-headers=En-têtes de réponse
catalog.category.parameters=Paramètres
catalog.category.resilience=Résilience et quotas
catalog.category.body=Corps
catalog.category.routing=Routage et réponse
catalog.category.other=Autres
catalog.category.custom=Fabriques maison

catalog.predicate.Path.summary=Retient la requête si son chemin correspond à l'un des motifs.
catalog.predicate.Path.details=* remplace un segment, ** tout le reste du chemin, et {id} capture un segment que les filtres peuvent réutiliser (SetPath, AddRequestHeader…).
catalog.predicate.Path.arg.patterns=Un ou plusieurs motifs séparés par des virgules, par exemple /api/orders/**.
catalog.predicate.Path.arg.matchTrailingSlash=true par défaut : /a/ correspond aussi au motif /a. Mettez false pour l'interdire.
catalog.predicate.Path.example=- Path=/api/users/{id}, /legacy/users/{id}

catalog.predicate.Host.summary=Retient la requête selon son en-tête Host.
catalog.predicate.Host.details=Accepte des motifs comme **.example.com, et capture des variables : {tenant}.example.com.
catalog.predicate.Host.arg.patterns=Un ou plusieurs motifs d'hôte, séparés par des virgules.
catalog.predicate.Host.example=- Host=api.example.com, {tenant}.example.com

catalog.predicate.Method.summary=Retient la requête si sa méthode HTTP fait partie de la liste.
catalog.predicate.Method.arg.methods=Méthodes séparées par des virgules, par exemple GET, POST.
catalog.predicate.Method.example=- Method=GET, HEAD

catalog.predicate.Header.summary=Retient la requête si un en-tête est présent, et éventuellement si sa valeur respecte une expression régulière.
catalog.predicate.Header.arg.header=Nom de l'en-tête.
catalog.predicate.Header.arg.regexp=Facultatif : expression régulière Java que la valeur doit respecter.
catalog.predicate.Header.example=- Header=X-Request-Id, \\d+

catalog.predicate.Query.summary=Retient la requête si un paramètre est présent, et éventuellement si sa valeur respecte une expression régulière.
catalog.predicate.Query.arg.param=Nom du paramètre.
catalog.predicate.Query.arg.regexp=Facultatif : expression régulière Java sur la valeur.
catalog.predicate.Query.arg.predicate=Facultatif : bean de test sur la valeur, à la place de l'expression régulière (configuration Java).
catalog.predicate.Query.example=- Query=version, v[12]

catalog.predicate.Cookie.summary=Retient la requête si un cookie est présent et que sa valeur respecte une expression régulière.
catalog.predicate.Cookie.arg.name=Nom du cookie.
catalog.predicate.Cookie.arg.regexp=Expression régulière Java que la valeur doit respecter.
catalog.predicate.Cookie.example=- Cookie=beta, enabled

catalog.predicate.After.summary=Retient les requêtes reçues après une date : utile pour activer une route à l'heure d'une mise en production.
catalog.predicate.After.arg.datetime=Date et heure avec fuseau, au format ISO 8601 (ZonedDateTime de Java).
catalog.predicate.After.example=- After=2026-11-01T08:00:00+01:00[Europe/Paris]

catalog.predicate.RemoteAddr.summary=Retient la requête selon l'adresse IP du client.
catalog.predicate.RemoteAddr.details=Derrière un proxy ou un load balancer, l'adresse vue est celle du proxy : préférez alors XForwardedRemoteAddr.
catalog.predicate.RemoteAddr.arg.sources=Adresses ou plages CIDR séparées par des virgules, par exemple 10.0.0.0/8.
catalog.predicate.RemoteAddr.example=- RemoteAddr=10.0.0.0/8, 192.168.1.10

catalog.predicate.Weight.summary=Répartit le trafic entre plusieurs routes d'un même groupe, selon un poids.
catalog.predicate.Weight.details=Toutes les routes du groupe doivent porter le même nom de groupe. Utile pour un déploiement canari : 90 % vers v1, 10 % vers v2.
catalog.predicate.Weight.arg.weight.group=Nom du groupe, identique sur toutes les routes concernées.
catalog.predicate.Weight.arg.weight.weight=Poids de cette route dans le groupe.
catalog.predicate.Weight.example=- Weight=orders, 90

catalog.filter.StripPrefix.summary=Retire les premiers segments du chemin avant d'appeler le service.
catalog.filter.StripPrefix.details=StripPrefix=1 sur /api/orders/42 transmet /orders/42 au service.
catalog.filter.StripPrefix.arg.parts=Nombre de segments à retirer en partant du début, 1 par défaut.
catalog.filter.StripPrefix.example=- StripPrefix=1

catalog.filter.PrefixPath.summary=Ajoute un préfixe devant le chemin transmis au service.
catalog.filter.PrefixPath.arg.prefix=Préfixe à ajouter, par exemple /v2.
catalog.filter.PrefixPath.example=- PrefixPath=/v2

catalog.filter.RewritePath.summary=Réécrit le chemin avec une expression régulière.
catalog.filter.RewritePath.details=Les groupes nommés (?<nom>...) se réutilisent dans le remplacement. En YAML, écrivez $\\{nom} : ${...} serait lu comme une propriété Spring.
catalog.filter.RewritePath.arg.regexp=Expression régulière Java appliquée au chemin, par exemple /api/(?<rest>.*).
catalog.filter.RewritePath.arg.replacement=Chemin de remplacement, par exemple /$\\{rest}.
catalog.filter.RewritePath.example=- RewritePath=/api/users/(?<rest>.*), /users/$\\{rest}

catalog.filter.SetPath.summary=Remplace entièrement le chemin, avec les variables capturées par le prédicat Path.
catalog.filter.SetPath.arg.template=Nouveau chemin, avec des variables, par exemple /products/{id}.
catalog.filter.SetPath.example=- SetPath=/products/{id}

catalog.filter.AddRequestHeader.summary=Ajoute un en-tête à la requête transmise au service.
catalog.filter.AddRequestHeader.details=La valeur peut reprendre une variable capturée par Path ou Host : {id}. Ne mettez pas de secret en clair : utilisez un placeholder ${...}.
catalog.filter.AddRequestHeader.arg.name=Nom de l'en-tête.
catalog.filter.AddRequestHeader.arg.value=Valeur de l'en-tête.
catalog.filter.AddRequestHeader.example=- AddRequestHeader=X-Request-Source, gateway

catalog.filter.SetRequestHeader.summary=Remplace un en-tête de la requête (ou l'ajoute s'il est absent) avant d'appeler le service.
catalog.filter.SetRequestHeader.details=Contrairement à AddRequestHeader, la valeur envoyée par le client est écrasée.
catalog.filter.SetRequestHeader.arg.name=Nom de l'en-tête.
catalog.filter.SetRequestHeader.arg.value=Nouvelle valeur.
catalog.filter.SetRequestHeader.example=- SetRequestHeader=X-Tenant, acme

catalog.filter.RemoveRequestHeader.summary=Retire un en-tête de la requête avant de l'envoyer au service.
catalog.filter.RemoveRequestHeader.details=Utile pour ne pas propager un en-tête interne ou un cookie.
catalog.filter.RemoveRequestHeader.arg.name=Nom de l'en-tête à retirer.
catalog.filter.RemoveRequestHeader.example=- RemoveRequestHeader=Cookie

catalog.filter.AddResponseHeader.summary=Ajoute un en-tête à la réponse renvoyée au client.
catalog.filter.AddResponseHeader.arg.name=Nom de l'en-tête.
catalog.filter.AddResponseHeader.arg.value=Valeur de l'en-tête.
catalog.filter.AddResponseHeader.arg.override=Facultatif : true pour remplacer un en-tête déjà présent dans la réponse.
catalog.filter.AddResponseHeader.example=- AddResponseHeader=X-Served-By, gateway

catalog.filter.AddRequestParameter.summary=Ajoute un paramètre à la query string de la requête transmise au service.
catalog.filter.AddRequestParameter.arg.name=Nom du paramètre.
catalog.filter.AddRequestParameter.arg.value=Valeur du paramètre ; peut reprendre une variable capturée : {id}.
catalog.filter.AddRequestParameter.example=- AddRequestParameter=source, gateway

catalog.filter.PreserveHostHeader.summary=Transmet au service l'en-tête Host d'origine, au lieu de celui de l'URI cible.
catalog.filter.PreserveHostHeader.details=Utile quand le service construit des liens absolus à partir de l'hôte demandé par le client.
catalog.filter.PreserveHostHeader.example=- PreserveHostHeader

catalog.filter.RedirectTo.summary=Répond par une redirection, sans appeler de service.
catalog.filter.RedirectTo.details=Pour une redirection seule, donnez à la route l'URI no://op.
catalog.filter.RedirectTo.arg.status=Code HTTP de redirection, de la série 300, par exemple 301 ou 302.
catalog.filter.RedirectTo.arg.url=URL de destination, placée dans l'en-tête Location.
catalog.filter.RedirectTo.arg.includeRequestParams=Facultatif : true pour reporter la query string de la requête dans la redirection.
catalog.filter.RedirectTo.example=- RedirectTo=302, https://www.example.com

catalog.filter.SetStatus.summary=Fixe le code HTTP de la réponse renvoyée au client.
catalog.filter.SetStatus.arg.status=Code HTTP, en nombre (404) ou en nom (NOT_FOUND).
catalog.filter.SetStatus.example=- SetStatus=404

catalog.filter.Retry.summary=Rejoue la requête vers le service en cas d'échec.
catalog.filter.Retry.details=Par défaut : 3 nouvelles tentatives, sur les erreurs 5xx et les erreurs réseau, pour la méthode GET seulement. Attention aux requêtes non idempotentes comme POST.
catalog.filter.Retry.arg.retries=Nombre de nouvelles tentatives, 3 par défaut.
catalog.filter.Retry.arg.statuses=Codes HTTP qui déclenchent une nouvelle tentative, par exemple BAD_GATEWAY.
catalog.filter.Retry.arg.methods=Méthodes rejouables, GET par défaut.
catalog.filter.Retry.arg.backoff.firstBackoff=Attente avant la première nouvelle tentative, par exemple 50ms. Sans backoff, les tentatives sont immédiates.
catalog.filter.Retry.arg.backoff.maxBackoff=Attente maximale entre deux tentatives.
catalog.filter.Retry.arg.backoff.factor=Multiplicateur de l'attente à chaque tentative.
catalog.filter.Retry.arg.backoff.basedOnPreviousValue=true pour calculer l'attente à partir de la précédente.
catalog.filter.Retry.arg.jitter.randomFactor=Part d'aléatoire ajoutée à l'attente, entre 0 et 1.
catalog.filter.Retry.arg.timeout=Délai maximal de chaque tentative, illimité par défaut.
catalog.filter.Retry.example=- name: Retry\n  args:\n    retries: 3\n    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE

